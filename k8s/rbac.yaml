---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-orchestrator
  labels:
    app: sandbox-orchestrator
rules:
  # Node info (needed by /resources endpoint)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]

  # Namespace management
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "delete", "get", "list", "watch"]
  
  # Pod management (need get for exec to work)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]
  
  # Pod exec (critical for command execution)
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  
  # Pod status
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "list", "watch"]
  
  # Pod logs (optional, for debugging)
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  
  # NetworkPolicy management
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete", "get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-orchestrator
  labels:
    app: sandbox-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-orchestrator
subjects:
  - kind: ServiceAccount
    name: sandbox-orchestrator
    namespace: orchestrator
