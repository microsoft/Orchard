[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchard-env"
version = "0.1.0"
description = "Orchard Env — Kubernetes-based sandbox orchestration for agent environments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Pin to <33: kubernetes>=33 + urllib3 2.x has a known regression where
    # in-cluster Bearer token is not sent correctly, causing 401 from apiserver.
    "kubernetes>=28.1.0,<33",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "redis>=5.0.0",
    # Required by the sync ContainerProcess (PTY exec). Optional at runtime —
    # only imported when sandbox.exec(pty=True) is called from the sync client.
    "websocket-client>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
]

[project.scripts]
orchard-env-orchestrator = "orchard_env.orchestrator.main:main"

[project.urls]
Homepage = "https://github.com/microsoft/Orchard"
Repository = "https://github.com/microsoft/Orchard"

[tool.setuptools.packages.find]
include = ["orchard_env*"]

[tool.setuptools.package-data]
orchard_env = ["agent/requirements.txt"]

[tool.pytest.ini_options]
# Only the offline unit tests are collected. tests/integration/ holds scripts
# that need a live orchestrator and are run by hand, never by pytest.
testpaths = ["tests"]
norecursedirs = ["tests/integration"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts prepend the repo root to sys.path before importing the SDK.
"tests/*" = ["E402"]
"examples/*" = ["E402"]
