apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-api-keys
  namespace: orchestrator
  labels:
    app: sandbox-orchestrator
type: Opaque
stringData:
  # Comma-separated API keys accepted by the orchestrator.
  # DO NOT commit real keys. Generate your own before deploying:
  #     python k8s/gen_keys.py
  # and either paste them here locally or create the Secret directly:
  #     kubectl create secret generic orchestrator-api-keys \
  #       -n orchestrator --from-literal=API_KEYS="key1,key2,key3"
  API_KEYS: >-
    REPLACE_WITH_GENERATED_KEY_1,
    REPLACE_WITH_GENERATED_KEY_2,
    REPLACE_WITH_GENERATED_KEY_3